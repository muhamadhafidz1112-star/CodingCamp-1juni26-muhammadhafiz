<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Theme Toggle -->
        <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">
            🌙
        </button>

        <!-- Greeting Section -->
        <section class="greeting-section">
            <h1 id="greeting" class="greeting"></h1>
            <p id="datetime" class="datetime"></p>
            <button id="changeNameBtn" class="btn-change-name">Change Name</button>
        </section>

        <!-- Focus Timer Section -->
        <section class="timer-section">
            <h2>Focus Timer</h2>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button id="startBtn" class="btn btn-start">Start</button>
                <button id="stopBtn" class="btn btn-stop">Stop</button>
                <button id="resetBtn" class="btn btn-reset">Reset</button>
            </div>
        </section>

        <!-- To-Do List Section -->
        <section class="todo-section">
            <h2>To-Do List</h2>
            <div class="todo-input-container">
                <input type="text" id="todoInput" placeholder="Add a new task..." class="todo-input">
                <button id="addTodoBtn" class="btn btn-add">Add</button>
            </div>
            <ul id="todoList" class="todo-list"></ul>
        </section>

        <!-- Quick Links Section -->
        <section class="links-section">
            <h2>Quick Links</h2>
            <div class="links-input-container">
                <input type="text" id="linkName" placeholder="Link name..." class="link-input">
                <input type="text" id="linkUrl" placeholder="https://..." class="link-input">
                <button id="addLinkBtn" class="btn btn-add">Add Link</button>
            </div>
            <div id="linksList" class="links-list"></div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
